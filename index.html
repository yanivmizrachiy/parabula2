<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שירי תלמידים להדפסה</title>
<meta name="description" content="דף שירי תלמידים להדפסה. מותאם לנייד, לווטסאפ ולהדפסת A4.">
<style>
:root{
  --paper:#ffffff;
  --ink:#101827;
  --boy:#1267d8;
  --girl:#d63384;
  --border:#e4e8f0;
  --print:#1e40af;
  --whatsapp:#047857;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;direction:rtl;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;line-height:1.5}
.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border);padding:10px}
.actions{width:min(100%,920px);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.action-button{width:100%;min-height:58px;border:0;border-radius:14px;color:#fff;font-size:1.08rem;font-weight:900;line-height:1.15;padding:14px 10px;text-align:center;text-decoration:none;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.print-button{background:var(--print)}
.whatsapp-button{background:var(--whatsapp)}
.action-button:active{filter:brightness(.92)}
.action-button:focus-visible{outline:3px solid #94a3b8;outline-offset:2px}
.sheet{width:min(100%,920px);margin:0 auto;padding:14px 10px 38px;background:white}
.poems{display:grid;grid-template-columns:1fr;gap:12px}
.poem{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:14px 12px;break-inside:avoid;page-break-inside:avoid}
.poem p{margin:.1rem 0;font-size:1.06rem}
.student-name{font-weight:950;padding:0 .04em}
.student-name.boy{color:var(--boy)}
.student-name.girl{color:var(--girl)}
@media (max-width:380px){.action-button{font-size:1rem;min-height:56px;padding:12px 8px}.sheet{padding:12px 8px 32px}.poem{padding:13px 11px;border-radius:14px}}
@media (min-width:760px){.poems{grid-template-columns:1fr 1fr}.poem p{font-size:1rem}}
@media print{@page{size:A4 portrait;margin:9mm}html,body{background:#fff;color:#000;width:210mm}.topbar{display:none!important}.sheet{width:100%;max-width:none;padding:0;margin:0}.poems{display:grid;grid-template-columns:1fr 1fr;gap:4.5mm}.poem{border:1px solid #d7d7d7;border-radius:5px;padding:4.2mm;box-shadow:none}.poem p{font-size:9.6pt;line-height:1.28;margin:0 0 1.2mm 0}.student-name.boy{color:#005bbb!important}.student-name.girl{color:#c2185b!important}}
</style>
</head>
<body>
<header class="topbar" aria-label="פעולות מהירות">
  <div class="actions">
    <button class="action-button print-button" id="printButton" type="button">הדפס</button>
    <a class="action-button whatsapp-button" id="whatsappButton" href="https://wa.me/?text=https%3A%2F%2Fyanivmizrachiy.github.io%2Fparabula2%2F" target="_blank" rel="noopener">שלח לווטסאפ</a>
  </div>
</header>
<main class="sheet">
  <section class="poems" id="poems" aria-label="שירי תלמידים"></section>
</main>
<script>
(function(){
  const pageUrl = 'https://yanivmizrachiy.github.io/parabula2/';
  const poemsData = [
    {name:'איתן',gender:'boy',lines:['איתן הוא אלוף המחשבים,','וכולם אותו ממש מחבבים.','הוא תמיד יודע להצחיק,','בלי לעצור ובלי להפסיק,','ובאופן קבוע — באנימה שקוע.']},
    {name:'הראל',gender:'boy',lines:['הראל הביא לכיתה את ברונדה,','בובת הכלב — הקמע של הכיתה.','בדיחות הוא זורק בכל רגע ושעה,','ולמה צריך ללמוד? זו אצלו שאלה קבועה,','עם הראל בכיתה — תמיד חגיגה.']},
    {name:'עידו',gender:'boy',lines:['עידו המוכשר הוא ספורטאי,','בלי גבול ובלי תנאי.','על המזרן ובמגרש משקיע בלי די,','בחברים סביבו תמיד מתחשב,','חבר נאמן — מכל הלב.']},
    {name:'עוז',gender:'boy',lines:['אם מחפשים את עוז בבקרים,','כנראה נמצא אותו עם החברים.','בכל השכבה יש לו קשרים,','לא נגמרים התירוצים והסיפורים,','וכל הסיבות שבעולם לאיחורים.']},
    {name:'שילת',gender:'girl',lines:['שילת המתולתלת,','באודיסאה מתרגלת.','חובבת ספרים — כך מספרים,','חשוב לה להיות מצטיינת,','ומעל הכול — חברה מושלמת.']},
    {name:'אור',gender:'girl',lines:['אור היא זמרת,','אלופה ומוכשרת.','ואצלה הקול — זה לא הכול,','כשמה כן היא — מאירה,','כיף ממש עם כזו חברה.']},
    {name:'עדן',gender:'girl',lines:['עדן מנגנת בפסנתר ובגיטרה,','ואפילו גם שרה.','מספיקה בהכול להתאמן,','זה פשוט לא ייאמן,','ובזכותה יש אווירה — אחלה חברה.']},
    {name:'אופיר',gender:'boy',lines:['אופיר מהארי פוטר מתלהב,','חידות ואתגרים אוהב.','מתמטיקה עבורו זה כיף,','הוא משקיע ולא מחפף,','ויודע לתת גם כתף.']},
    {name:'זיו',gender:'boy',lines:['כדורסל בשביל זיו,','זה תמיד משהו מגניב.','הוא קולע המון,','וחובב גם פוקימון,','חבר נאמן — וצוחק בלי חשבון.']},
    {name:'לינוי',gender:'girl',lines:['לינוי מבשלת דברים טעימים,','ומכינה באהבה לכל החברים.','אושר כהן אצלה תמיד מתנגן,','בסטודיו היא אוהבת להתאמן,','מוכשרת ממש — שזה לא ייאמן.']},
    {name:'רותם',gender:'boy',lines:['רותם חבר מיוחד וצנוע,','אלוף כדורסל — לכולם זה ידוע.','עם ידע עולם רחב ועשיר,','בלימודים הוא עוזר ומסביר,','רותם כזה — זה משהו נדיר.']},
    {name:'לירז',gender:'boy',lines:['לירז חכם ופותר במהירות,','במתמטיקה הכול בקלילות.','חולם להיות עורך דין מגניב,','יודע במיוחד לעזור ולהקשיב,','רגיש לסביבה — ודואג מסביב.']},
    {name:'שירה',gender:'girl',lines:['עם שירה תמיד שמח,','נציגתנו בהדרכת השל״ח.','חברות סביבה מקיפות,','והיא אלופה בלאפות,','עושה הכול, עם לב גדול!']},
    {name:'תמר',gender:'girl',lines:['תמר אוהבת טיפוח, יופי ואיפור,','לשיעור אמנות יש לה חיבור.','בלי איפור לא מגיעה — זה ברור,','הכול אצלה בסטייל, צבע וציור,','תמר כזו — עם טעם ברור.']},
    {name:'שקד',gender:'girl',lines:['שקד קוראת ספרים — שקדנית כשמה,','בכל שיעור כותבת ומסכמת ברמה.','אחרי שלוש שנים עוברת למודיעין,','חשוב לה לחשוב, לסכם ולהבין,','וחברות טובות בכיתה — חבורה קבועה.']},
    {name:'אביתר',gender:'boy',lines:['אביתר גר באדם,','ומכבד תמיד את כולם.','בלימודים מצטיין, בשקט ובחוכמה,','מעיר הערות חכמות שתורמות לאווירה,','ובדיחות שלו בכיתה — מוסיפות שמחה.']},
    {name:'אורי',gender:'boy',lines:['אורי ספורטאי בג׳ודו ובכדורסל,','בין אימון לשיעור הוא לא מתבלבל.','את המורים שואל שאלות בלי הפסקות,','בגלל האימונים לומד בלילות,','בין מגרש ומזרן — אורי מלא יכולות.']},
    {name:'אייל',gender:'boy',lines:['אייל הוא אלוף המחשבים,','וברווזים אצלו תמיד אהובים.','בפינג־פונג הוא נכנס לעניינים,','בין קליק, קוואק וכדורים,','אייל כזה — מלא תחביבים.']},
    {name:'איתי',gender:'boy',lines:['איתי מבריק ושחקן מצטיין,','כמעט כל יום בכדורגל מתאמן.','גם במבחנים הוא מפתיע שוב ושוב,','בעתיד בקבוצה מפורסמת יהיה חשוב,','ונבקש חתימה — כי הוא יהיה כוכב אהוב.']},
    {name:'אריק',gender:'boy',lines:['אריק הוא שחקן כדורגל מהיר,','שיעורי בית מכין בקצב אדיר.','אוהב לנשנש דברים טעימים,','בהפסקות משתולל כשהמורים לא רואים,','אריק כזה — תמיד בעניינים.']},
    {name:'הדר',gender:'girl',lines:['הדר רקדנית וגם שקדנית,','מתאמנת הרבה ברצינות אמיתית.','עם הלהקה שלה זוכה בפרסים,','חשוב לה להצליח בלימודים,','ואת הכיתה באמנות מקשטת בצבעים.']},
    {name:'יהלי',gender:'boy',lines:['יהלי אוהב כדורסל — זה ידוע,','ולסקי במדינות שונות נוסע קבוע.','גם כשגר רחוק, בזמן הוא מגיע,','בלימודים בקלות מצליח ומפתיע,','יהלי כזה — תמיד מדויק וקולע.']},
    {name:'נועם אליהו',gender:'boy',lines:['נועם אליהו מומחה לבית״ר ירושלים,','בתולדות הקבוצה שולט בפרטים הקטנים.','אוהב כדורגל וגם כדורסל,','לומד מעולה בלי רעש בכלל,','בלי רוח וצלצולים — פשוט גדול.']},
    {name:'נועם מרטיניוק',gender:'boy',lines:['נועם מרטיניוק טייל השנה במדינות,','וגם בארץ יצא לחופשות.','בג׳ודו מתאמן ואוהב לבלות,','למורים נחמד ושואל לשלומם,','נועם כזה — עושה טוב לכולם.']},
    {name:'נועם ששון',gender:'girl',lines:['נועם ששון תמיד עם מסטיק,','וכשהצלצול מגיע — קופצת בצ׳יק.','חשוב לה להצליח במבחנים,','מדברת בשם הכיתה מול המורים,','ואומרת בקול את מה שכולם חושבים.']},
    {name:'נתנאל',gender:'boy',lines:['נתנאל חכם ושקט, עם ידע עשיר,','ובכל נושא יודע להסביר.','בחידון ירושלים את בית הספר ייצג,','וזה בהחלט היה הישג,','ממוצא בריטי — תלמיד רציני ואדיר.']},
    {name:'עידן מכחל',gender:'boy',lines:['עידן מכחל מופנם ושקט,','וכשהוא מדבר — זה חכם ומדויק.','שקדן, עם הישגים טובים,','נועם הליכות בכל המעשים,','עידן כזה — פשוט מרשים.']},
    {name:'עידן רייטר',gender:'boy',lines:['עידן רייטר מצייר בכישרון,','במשחקי מחשב יש לו דמיון.','בעריכת סרטים הוא בעניינים,','קובייה הונגרית גם בין התחביבים,','עידן כזה — מלא כישורים.']}
  ];

  const poemsRoot = document.getElementById('poems');
  const printButton = document.getElementById('printButton');
  const whatsappButton = document.getElementById('whatsappButton');

  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, (char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
  }

  function lineWithName(line, name, gender){
    const safeLine = escapeHtml(line);
    const safeName = escapeHtml(name);
    const className = gender === 'girl' ? 'girl' : 'boy';
    return safeLine.replace(safeName, '<span class="student-name '+className+'">'+safeName+'</span>');
  }

  function render(){
    poemsRoot.innerHTML = poemsData.map((poem)=>{
      let marked = false;
      const lines = poem.lines.map((line)=>{
        const contains = !marked && line.includes(poem.name);
        if(contains){ marked = true; return '<p>'+lineWithName(line, poem.name, poem.gender)+'</p>'; }
        return '<p>'+escapeHtml(line)+'</p>';
      }).join('');
      return '<article class="poem" data-student="'+escapeHtml(poem.name)+'" data-gender="'+poem.gender+'">'+lines+'</article>';
    }).join('');
  }

  function validate(){
    const problems = [];
    const poems = Array.from(document.querySelectorAll('.poem'));
    if(poems.length !== 28) problems.push('מספר השירים אינו 28');
    poems.forEach((poem)=>{
      const name = poem.dataset.student || 'ללא שם';
      const lines = poem.querySelectorAll('p');
      if(lines.length !== 5) problems.push(name + ': ' + lines.length + ' שורות במקום 5');
      if(!poem.querySelector('.student-name')) problems.push(name + ': השם לא סומן בצבע בתוך השיר');
    });
    if(problems.length){
      console.error('בדיקת תקינות נכשלה:', problems);
      alert('נמצאו בעיות בדף: ' + problems.join(' | '));
      return false;
    }
    return true;
  }

  render();
  validate();

  printButton.addEventListener('click', ()=>{
    if(validate()) window.print();
  });

  const shareText = 'שירי תלמידים להדפסה: ' + pageUrl;
  whatsappButton.href = 'https://wa.me/?text=' + encodeURIComponent(shareText);
  whatsappButton.addEventListener('click', (event)=>{
    event.preventDefault();
    if(!validate()) return;
    const url = 'https://wa.me/?text=' + encodeURIComponent(shareText);
    const opened = window.open(url, '_blank', 'noopener');
    if(!opened) window.location.href = url;
  });
})();
</script>
</body>
</html>
